<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Reuma360 · La Reumatología, completa y a mano. Chuleta de consulta con criterios, calculadoras, tratamiento y seguimiento.">
<meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1518" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reuma360">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Reuma360</title>
<style>
/* Reuma360 — layout: mobile-first app shell (sticky search bar + bottom tab bar); desktop adds a fixed sidebar tree.
   Families are colour-coded with the same 7 hues as the app icon (a ring of 7 sectors). */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef1f3; --line:#d9e0e4; --line-2:#c5ced4;
  --ink:#162127; --ink-2:#3c4a52; --muted:#5d6b73;
  --accent:#1f5a6b; --accent-2:#e6eff2; --accent-ink:#ffffff; --focus:#2b7a90;
  --mark:#ffe58a; --mark-ink:#1b1b1b;
  /* activity / result bands */
  --rem:#1e7b45; --rem-bg:#e3f3e9; --low:#3f7f16; --low-bg:#edf5df; --mod:#9a6400; --mod-bg:#fdf1d8;
  --high:#b42b23; --high-bg:#fbe5e2; --vhigh:#7f1d1d; --vhigh-bg:#f6dada; --na:#5d6b73; --na-bg:#eef1f3;
  /* families (base / text-safe ink / tint) */
  --f-infl:#d9483b;  --f-infl-ink:#b2342a;  --f-infl-bg:#fbe9e6;
  --f-autoinf:#ec7a26; --f-autoinf-ink:#b45512; --f-autoinf-bg:#fdeee1;
  --f-micro:#e0a21b; --f-micro-ink:#8f6400; --f-micro-bg:#fcf3dc;
  --f-otras:#3f9b5b; --f-otras-ink:#2a7a43; --f-otras-bg:#e5f3e9;
  --f-osea:#2a8ca8;  --f-osea-ink:#1d6f87;  --f-osea-bg:#e2f1f6;
  --f-conect:#7f57c8; --f-conect-ink:#6542a8; --f-conect-bg:#efe9f9;
  --f-vasc:#c33a7e;  --f-vasc-ink:#a32a66;  --f-vasc-bg:#f8e5ef;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --topbar-h:60px; --bottombar-h:64px;
  --shadow:0 1px 2px rgba(16,30,38,.06),0 4px 16px rgba(16,30,38,.06);
  --fs:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1518; --surface:#161e22; --surface-2:#1d272c; --line:#2a363c; --line-2:#36454c;
  --ink:#e6edf0; --ink-2:#c3cfd4; --muted:#93a3ab;
  --accent:#7cc0d3; --accent-2:#1b2d34; --accent-ink:#0f1518; --focus:#8fd0e2;
  --mark:#7a6420; --mark-ink:#fff6d6;
  --rem:#5fcf8b; --rem-bg:#16301f; --low:#9ad25a; --low-bg:#223015; --mod:#f2bd52; --mod-bg:#33280f;
  --high:#ff8a7d; --high-bg:#3a1a17; --vhigh:#ff6b6b; --vhigh-bg:#451414; --na:#93a3ab; --na-bg:#1d272c;
  --f-infl:#f06a5d; --f-infl-ink:#ff8f84; --f-infl-bg:#3a1c19;
  --f-autoinf:#f79245; --f-autoinf-ink:#ffab6b; --f-autoinf-bg:#3a2414;
  --f-micro:#ebb53a; --f-micro-ink:#f5c95f; --f-micro-bg:#352a10;
  --f-otras:#5cbc78; --f-otras-ink:#7fd497; --f-otras-bg:#173020;
  --f-osea:#47aac6; --f-osea-ink:#73c4db; --f-osea-bg:#132e37;
  --f-conect:#9d7ae0; --f-conect-ink:#bba0f0; --f-conect-bg:#271d3d;
  --f-vasc:#e05a9b; --f-vasc-ink:#f48cbd; --f-vasc-bg:#3a1729;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1518; --surface:#161e22; --surface-2:#1d272c; --line:#2a363c; --line-2:#36454c;
  --ink:#e6edf0; --ink-2:#c3cfd4; --muted:#93a3ab;
  --accent:#7cc0d3; --accent-2:#1b2d34; --accent-ink:#0f1518; --focus:#8fd0e2;
  --mark:#7a6420; --mark-ink:#fff6d6;
  --rem:#5fcf8b; --rem-bg:#16301f; --low:#9ad25a; --low-bg:#223015; --mod:#f2bd52; --mod-bg:#33280f;
  --high:#ff8a7d; --high-bg:#3a1a17; --vhigh:#ff6b6b; --vhigh-bg:#451414; --na:#93a3ab; --na-bg:#1d272c;
  --f-infl:#f06a5d; --f-infl-ink:#ff8f84; --f-infl-bg:#3a1c19;
  --f-autoinf:#f79245; --f-autoinf-ink:#ffab6b; --f-autoinf-bg:#3a2414;
  --f-micro:#ebb53a; --f-micro-ink:#f5c95f; --f-micro-bg:#352a10;
  --f-otras:#5cbc78; --f-otras-ink:#7fd497; --f-otras-bg:#173020;
  --f-osea:#47aac6; --f-osea-ink:#73c4db; --f-osea-bg:#132e37;
  --f-conect:#9d7ae0; --f-conect-ink:#bba0f0; --f-conect-bg:#271d3d;
  --f-vasc:#e05a9b; --f-vasc-ink:#f48cbd; --f-vasc-bg:#3a1729;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
svg.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);background:var(--bg);border-bottom:1px solid var(--line);height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 16px}
@supports (backdrop-filter:blur(8px)){.topbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none;border-radius:10px}
.brand svg{width:34px;height:34px}
.brand b{font-size:1.06rem;letter-spacing:-.01em;display:none}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line-2);background:var(--surface);border-radius:22px;padding:0 44px 0 42px;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;border-radius:50%;color:var(--muted);display:grid;place-items:center;cursor:pointer}
[data-hasq] ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none!important}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 .72rem var(--mono);color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;display:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.topbar .desk{display:none}

.layout{display:block}
.sidebar{display:none}
main{padding:16px 16px calc(var(--bottombar-h) + 28px + env(safe-area-inset-bottom,0px));max-width:880px;margin:0 auto;min-width:0}

.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar a{height:var(--bottombar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.01em}
.bottombar a svg{width:24px;height:24px}
.bottombar a[aria-current="page"]{color:var(--accent)}
.bottombar a[aria-current="page"] .pill{background:var(--accent-2)}
.bottombar .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}

@media (min-width:1000px){
  .brand b{display:inline}
  .search{max-width:620px}
  [data-hasq] ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none!important}
.search kbd{display:block}
  .topbar .desk{display:grid}
  .layout{display:grid;grid-template-columns:288px minmax(0,1fr)}
  .sidebar{display:block;position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--topbar-h));overflow-y:auto;border-right:1px solid var(--line);padding:14px 10px 40px;background:var(--surface)}
  .bottombar{display:none}
  main{padding:24px 32px 64px}
}

/* sidebar tree */
.side-quick{display:grid;gap:2px;margin-bottom:12px}
.side-quick a,.tree a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.92rem}
.side-quick a:hover,.tree a:hover{background:var(--surface-2)}
.side-quick a[aria-current="page"],.tree a[aria-current="page"]{background:var(--accent-2);color:var(--ink);font-weight:600}
.tree details{margin:2px 0}
.tree summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:650;font-size:.86rem;color:var(--ink)}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--surface-2)}
.tree summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.tree details[open] summary .chev{transform:rotate(90deg)}
.tree ul{list-style:none;margin:0 0 6px;padding:0 0 0 22px}
.tree a.pend{color:var(--muted)}
.tree a .pd{margin-left:auto;font-size:.7rem;white-space:nowrap;color:var(--muted)}
.tree a .nm{flex:1;min-width:0}
.side-h{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}

/* family dot / tile */
.fdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--fc)}
.ftile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--fbg);color:var(--fink)}
.ftile svg{width:22px;height:22px}
[data-fam="infl"]{--fc:var(--f-infl);--fink:var(--f-infl-ink);--fbg:var(--f-infl-bg)}
[data-fam="conect"]{--fc:var(--f-conect);--fink:var(--f-conect-ink);--fbg:var(--f-conect-bg)}
[data-fam="vasc"]{--fc:var(--f-vasc);--fink:var(--f-vasc-ink);--fbg:var(--f-vasc-bg)}
[data-fam="micro"]{--fc:var(--f-micro);--fink:var(--f-micro-ink);--fbg:var(--f-micro-bg)}
[data-fam="autoinf"]{--fc:var(--f-autoinf);--fink:var(--f-autoinf-ink);--fbg:var(--f-autoinf-bg)}
[data-fam="osea"]{--fc:var(--f-osea);--fink:var(--f-osea-ink);--fbg:var(--f-osea-bg)}
[data-fam="otras"]{--fc:var(--f-otras);--fink:var(--f-otras-ink);--fbg:var(--f-otras-bg)}
[data-fam="gen"]{--fc:var(--accent);--fink:var(--accent);--fbg:var(--accent-2)}

/* ---------- generic ---------- */
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em;line-height:1.2}
h1{font-size:1.6rem;margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.fam{background:var(--fbg);color:var(--fink)}
.chip.pend{background:var(--na-bg);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(var(--bottombar-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:1000px){.toast{bottom:24px}}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:6px 0 18px}
.hero svg{width:64px;height:64px;flex:none}
.hero h1{font-size:1.85rem;letter-spacing:-.03em}
.hero p{margin:2px 0 0;color:var(--muted)}
.block{margin:22px 0}
.block>h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qa{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:96px}
.qa:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.qa b{font-size:.92rem;line-height:1.25}
.qa span{font-size:.78rem;color:var(--muted)}
.pinlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pinlist::-webkit-scrollbar{display:none}
.pin{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.88rem;font-weight:600;white-space:nowrap;flex:none}
.pin .fdot{width:9px;height:9px}
.empty{padding:14px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:.88rem}

.fams{display:grid;gap:12px}
@media (min-width:720px){.fams{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fam-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fam-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fam-head h3{margin:0;font-size:1rem}
.fam-head .count{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.dlist{list-style:none;margin:0;padding:4px 0}
.dlist a{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px;text-decoration:none;color:var(--ink)}
.dlist a:hover{background:var(--surface-2)}
.dlist a .nm{flex:1;min-width:0}
.dlist a.pend .nm{color:var(--muted)}
.dlist a .go{color:var(--muted)}
.dlist .short{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:6px}

/* ---------- disease page ---------- */
.dhead{display:flex;gap:14px;align-items:flex-start;padding:4px 0 12px}
.dhead .ftile{width:48px;height:48px;border-radius:13px}
.dhead .ftile svg{width:26px;height:26px}
.dhead .meta{flex:1;min-width:0}
.dhead h1{font-size:1.5rem}
.dhead .sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:.8rem;color:var(--muted)}
.dhead .acts{display:flex;gap:2px;flex:none}
.favbtn[aria-pressed="true"]{color:var(--f-micro)}
.favbtn[aria-pressed="true"] svg{fill:currentColor}
.tabs{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));z-index:30;background:var(--bg);margin:0 -16px;padding:6px 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:1000px){.tabs{margin:0 -32px;padding:8px 32px 10px}}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:.88rem;cursor:pointer}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{display:none;padding-top:14px}
.panel.on{display:block}
.ptitle{display:none}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;scroll-margin-top:130px}
.sec>h2{font-size:1.08rem;margin:0 0 12px;display:flex;gap:8px;align-items:baseline}
.sec>h2 .n{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.sec h3{font-size:.95rem;margin:16px 0 8px}
.sec h3:first-child{margin-top:0}
.sec p{margin:8px 0}
.src{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);font-size:.7rem;line-height:1.4;color:var(--muted)}
.src b{font-weight:600}
.pc{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.off{display:inline-block;font-size:.66rem;font-weight:700;color:var(--mod);background:var(--mod-bg);border-radius:4px;padding:0 5px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.nf{display:inline-block;font-size:.66rem;font-weight:700;color:var(--high);background:var(--high-bg);border-radius:4px;padding:0 5px;margin-left:3px;vertical-align:1px;white-space:nowrap}
ul.l{margin:6px 0;padding-left:1.15em}
ul.l li{margin:4px 0}
ul.l li::marker{color:var(--muted)}
.dl{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.dl:hover{border-bottom-color:var(--accent)}
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:var(--r-sm)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;min-width:100%}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t thead th{background:var(--surface-2);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:700}
table.t tbody tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;margin:10px 0}
.alert{display:flex;gap:10px;background:var(--mod-bg);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;margin:10px 0}
.alert svg{color:var(--mod);margin-top:2px}
.alert.red{background:var(--high-bg)}
.alert.red svg{color:var(--high)}
.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:6px 14px;margin:8px 0;font-size:.92rem}
.kv dt{font-weight:650;color:var(--ink-2)}
.kv dd{margin:0;min-width:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}

/* algorithm steps */
.steps{list-style:none;margin:6px 0;padding:0;display:grid;gap:0}
.step{position:relative;padding:0 0 0 46px}
.step::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .num{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.85rem}
.step .box{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);margin-bottom:6px}
.step .box h4{margin:0 0 4px;font-size:.95rem}
.step .when{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--ink-2);padding:6px 0 14px}
.step .when svg{color:var(--accent);margin-top:2px}
.step .when b{color:var(--ink)}
.cards{display:grid;gap:10px;margin:8px 0}
@media (min-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);min-width:0}
.dcard h4{margin:0 0 6px;font-size:.92rem;display:flex;align-items:center;gap:8px}
.dcard h4 svg{color:var(--accent)}
.dcard .lv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;font-size:.86rem}
.dcard .lv span.k{font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:3px;white-space:nowrap}
.druglinks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.druglinks a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;font-size:.88rem}
.druglinks a:hover{border-color:var(--accent)}
.druglinks a svg{color:var(--accent);width:16px;height:16px}
.dgroup{margin:10px 0}
.dgroup h4{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* guía frente a España */
.vs{display:grid;gap:8px;margin:8px 0}
.vsrow{display:grid;grid-template-columns:1fr;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg)}
@media (min-width:720px){.vsrow{grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}}
.vst{font-weight:700;font-size:.92rem}
.vsg,.vse{font-size:.88rem;min-width:0;display:grid;gap:3px}
.vl{display:inline-block;justify-self:start;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.vsg .vl{background:var(--accent-2);color:var(--accent)}
.vse .vl{background:var(--mod-bg);color:var(--mod)}
/* labs */
.labs{display:grid;gap:10px}
.labbox{border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--line);background:var(--bg)}
.labbox h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px}
.labbox.key{background:var(--fbg);border-color:color-mix(in srgb,var(--fc) 40%,transparent)}
.labbox.key h4{color:var(--fink)}
.labbox ul{margin:0;padding-left:1.1em}
.labbox li{margin:3px 0}
.freq{display:inline-block;font-size:.74rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:0 6px;margin-left:4px;white-space:nowrap}
.labbox.key .freq{background:var(--surface)}
mark,.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.hi{background:var(--fbg);color:var(--fink);font-weight:700;border-radius:4px;padding:0 3px}

/* ---------- calculators & criteria ---------- */
.calc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0 0 14px;overflow:hidden;scroll-margin-top:130px}
.calc-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.calc-h h3{margin:0;font-size:1rem;flex:1}
.calc-h svg{color:var(--accent)}
.calc-b{padding:14px;display:grid;gap:12px}
.fields{display:grid;gap:12px}
@media (min-width:560px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{min-width:0}
.field label,.field .lab{display:block;font-size:.84rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:.72rem;color:var(--muted);font-weight:500}
.ctrl{display:flex;align-items:stretch;gap:6px}
.ctrl input{flex:1;min-width:0;height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);padding:0 12px;font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield}
.ctrl input::-webkit-outer-spin-button,.ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctrl input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.ctrl .st{width:48px;height:48px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:1.4rem;font-weight:500;cursor:pointer;display:grid;place-items:center;flex:none;touch-action:manipulation}
.ctrl .st:active{background:var(--surface-2)}
.field.err input{border-color:var(--high);background:var(--high-bg)}
.field .msg{font-size:.75rem;color:var(--high);margin-top:4px;min-height:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:0 10px;min-width:56px;height:48px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.segfull{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.segfull button{border:0;background:var(--surface);min-height:44px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--ink-2);padding:4px}
.segfull button+button{border-left:1px solid var(--line-2)}
.segfull button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.res{border-radius:var(--r-sm);padding:12px 14px;background:var(--na-bg);display:grid;gap:8px}
.res .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.res .val{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.res .lbl{font-weight:800;font-size:1rem}
.res .det{font-size:.8rem;color:var(--ink-2)}
.res .acts{margin-left:auto;display:flex;gap:6px}
.res[data-l="rem"]{background:var(--rem-bg)} .res[data-l="rem"] .lbl,.res[data-l="rem"] .val{color:var(--rem)}
.res[data-l="low"]{background:var(--low-bg)} .res[data-l="low"] .lbl,.res[data-l="low"] .val{color:var(--low)}
.res[data-l="mod"]{background:var(--mod-bg)} .res[data-l="mod"] .lbl,.res[data-l="mod"] .val{color:var(--mod)}
.res[data-l="high"]{background:var(--high-bg)} .res[data-l="high"] .lbl,.res[data-l="high"] .val{color:var(--high)}
.res[data-l="vhigh"]{background:var(--vhigh-bg)} .res[data-l="vhigh"] .lbl,.res[data-l="vhigh"] .val{color:var(--vhigh)}
.res[data-l="na"] .val{color:var(--muted);font-size:1.1rem;font-weight:700}
.scale{display:flex;height:8px;border-radius:4px;overflow:hidden;position:relative;margin-top:2px}
.scale i{display:block;height:100%}
.scale i.rem{background:var(--rem)} .scale i.low{background:var(--low)} .scale i.mod{background:var(--mod)} .scale i.high{background:var(--high)} .scale i.vhigh{background:var(--vhigh)}
.scalewrap{position:relative;padding-top:4px}
.scalewrap .mk{position:absolute;top:-3px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.scalewrap .ticks{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.calc .src{margin:0;padding:0 14px 12px;border:0}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:.9rem}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0}
.opt .tx{flex:1;min-width:0}
.opt .pts{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-2)}
.grp{display:grid;gap:6px}
.grp>.gh{font-size:.8rem;font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.grp>.gh .gn{font-weight:500;color:var(--muted);font-size:.74rem}
.gate{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:.85rem;background:var(--bg)}
.grid17{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.grid17 .lab{font-size:.86rem}
.grid17 .segfull{grid-auto-columns:40px}

/* ---------- drug page ---------- */
.dg-head{display:flex;gap:14px;align-items:flex-start;padding:4px 0 14px}

.dg-sec h2{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}

.adj{display:grid;gap:8px}

.adj b{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.usedin{display:flex;flex-wrap:wrap;gap:8px}
.usedin a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:20px;background:var(--fbg);color:var(--fink);text-decoration:none;font-weight:650;font-size:.86rem}
.dindex{display:grid;gap:14px}
.dindex section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dindex h2{margin:0;padding:10px 14px;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dindex ul{list-style:none;margin:0;padding:0}
.dindex li a{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.dindex li:last-child a{border-bottom:0}
.dindex li a:hover{background:var(--surface-2)}
.dindex li a small{color:var(--muted);margin-left:auto;font-size:.75rem;text-align:right}
.alpha{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}

/* ---------- search panel ---------- */
.spanel{position:fixed;left:0;right:0;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));bottom:0;z-index:50;background:var(--bg);overflow-y:auto;padding:8px 16px calc(var(--bottombar-h) + 24px)}
@media (min-width:1000px){.spanel{left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 32px));bottom:auto;max-height:min(70vh,640px);top:calc(var(--topbar-h) + 6px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.18);background:var(--surface);padding:8px}}
.sgroup h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 4px}
.sres{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;text-decoration:none;color:var(--ink);min-height:52px}
.sres:hover,.sres.sel{background:var(--surface-2)}
.sres .ftile{width:34px;height:34px;border-radius:9px}
.sres .ftile svg{width:18px;height:18px}
.sres .tt{flex:1;min-width:0}
.sres .tt b{display:block;font-size:.95rem;font-weight:650}
.sres .tt span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shint{padding:16px 8px;color:var(--muted);font-size:.9rem}
.shint .row{margin-top:10px}

/* ---------- settings ---------- */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;display:grid;gap:10px}
.set h2{font-size:.95rem;margin:0}
.fsdemo{font-size:1rem;color:var(--ink-2)}
.pendbox{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.pendbox .tabsghost{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.foot{margin:28px 0 0;font-size:.74rem;color:var(--muted);line-height:1.5}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f2f2f2;--ink:#000;--ink-2:#222;--muted:#555;--line:#bbb;--line-2:#999;color-scheme:light}
  html{font-size:11pt}
  .topbar,.bottombar,.sidebar,.tabs,.spanel,.toast,.dhead .acts,.res .acts,.ctrl .st,.noprint{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .panel{display:block!important;padding-top:0}
  .ptitle{display:block;font-size:1.15rem;margin:16px 0 8px;border-bottom:2px solid #000;padding-bottom:2px;break-after:avoid}
  .sec,.calc,.dg-sec{break-inside:avoid;box-shadow:none;border-color:#bbb}
  .step .num{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
  .tw{overflow:visible}
  .src{color:#444}
}

</style>

/* Reuma360 — calculadoras y criterios (fórmulas de las publicaciones originales) */
(function(R){
const band = (x, list) => { for(const [thr, op, l, t] of list){ if(op==='<' ? x<thr : (op==='<=' ? x<=thr : true)) return {l, t}; } return {l:'na', t:''}; };
const nad28 = {k:'nad', l:'Articulaciones dolorosas (NAD28)', min:0, max:28, int:true, ab:'NAD28'};

const vas10 = (k, l, ab) => ({k, l, h:'0–10', min:0, max:10, step:1, ab});

/* ---------- AR ---------- */
const dasBands = [[2.6,'<','rem','Remisión'],[3.2,'<=','low','Baja actividad'],[5.1,'<=','mod','Actividad moderada'],[Infinity,'<=','high','Alta actividad']];
C.das28vsg = {t:'DAS28-VSG', alias:'DAS28 ESR', f:[nad28, nat28, {k:'vsg', l:'VSG', h:'mm/h', min:1, max:150, int:true, ab:'VSG', u:'mm/h'}, {k:'egp', l:'Evaluación global del paciente (EGP)', h:'0–100 mm', min:0, max:100, step:5, ab:'EGP', u:'mm'}],
  fn:v=>0.56*Math.sqrt(v.nad)+0.28*Math.sqrt(v.nat)+0.70*Math.log(v.vsg)+0.014*v.egp,
  interp:x=>band(x,dasBands), scale:{min:0,max:9,b:[[2.6,'rem'],[3.2,'low'],[5.1,'mod'],[9,'high']]},
  src:'Prevoo MLL, Arthritis Rheum 1995;38:44-8. Puntos de corte: remisión <2,6; baja ≤3,2; moderada ≤5,1; alta >5,1.'};
C.das28pcr = {t:'DAS28-PCR', alias:'DAS28 CRP', f:[nad28, nat28, {k:'pcr', l:'PCR', type:'crp'}, {k:'egp', l:'Evaluación global del paciente (EGP)', h:'0–100 mm', min:0, max:100, step:5, ab:'EGP', u:'mm'}],
  fn:v=>0.56*Math.sqrt(v.nad)+0.28*Math.sqrt(v.nat)+0.36*Math.log(v.pcr_mgL+1)+0.014*v.egp+0.96,
  interp:x=>band(x,dasBands), scale:{min:0,max:9,b:[[2.6,'rem'],[3.2,'low'],[5.1,'mod'],[9,'high']]},
  note:'Con PCR se obtienen valores algo menores que con VSG usando los mismos puntos de corte: interpreta la remisión con cautela.',
  src:'Fórmula DAS28-PCR (das-score.nl, Radboud UMC); Wells G, Ann Rheum Dis 2009;68:954-60.'};
const sdaiBands = [[3.3,'<=','rem','Remisión'],[11,'<=','low','Baja actividad'],[26,'<=','mod','Actividad moderada'],[Infinity,'<=','high','Alta actividad']];
C.sdai = {t:'SDAI', f:[nad28, nat28, vas10('egp','Evaluación global del paciente (EGP)','EGP'), vas10('egm','Evaluación global del médico (EGM)','EGM'), {k:'pcr', l:'PCR', type:'crp'}],
  fn:v=>v.nad+v.nat+v.egp+v.egm+v.pcr_mgdL, dec:1,
  interp:x=>band(x,sdaiBands), scale:{min:0,max:40,b:[[3.3,'rem'],[11,'low'],[26,'mod'],[40,'high']]},
  note:'La PCR entra en mg/dL (la calculadora convierte si la introduces en mg/L).',

C.cdai = {t:'CDAI', f:[nad28, nat28, vas10('egp','Evaluación global del paciente (EGP)','EGP'), vas10('egm','Evaluación global del médico (EGM)','EGM')],

  scale:{min:0,max:40,b:[[2.8,'rem'],[10,'low'],[22,'mod'],[40,'high']]},

C.asdasvsg = {t:'ASDAS-VSG', alias:'ASDAS ESR', f:[...asdasF, {k:'vsg', l:'VSG', h:'mm/h', min:0, max:150, int:true, ab:'VSG', u:'mm/h'}],
  fn:v=>0.08*v.back+0.07*v.stiff+0.11*v.pga+0.09*v.per+0.29*Math.sqrt(v.vsg), dec:2,

C.hscore = {t:'HScore (síndrome hemofagocítico / SAM)', alias:'hscore sam linfohistiocitosis', f:[
  {k:'is', l:'Inmunodepresión conocida (VIH o inmunosupresión prolongada)', type:'sel', o:[[0,'No'],[18,'Sí']], ab:'Inmunodepresión'},
  {k:'t', l:'Temperatura máxima', type:'sel', o:[[0,'<38,4 °C'],[33,'38,4–39,4 °C'],[49,'>39,4 °C']], ab:'Tª'},
  {k:'om', l:'Organomegalia', type:'sel', o:[[0,'No'],[23,'Hepato o esplenomegalia'],[38,'Ambas']], ab:'Organomegalia'},
  {k:'cit', l:'Citopenias (Hb ≤9,2 g/dL, leucocitos ≤5.000, plaquetas ≤110.000)', type:'sel', o:[[0,'1 serie o ninguna'],[24,'2 series'],[34,'3 series']], ab:'Citopenias'},
  {k:'fer', l:'Ferritina', type:'sel', o:[[0,'<2.000 ng/mL'],[35,'2.000–6.000'],[50,'>6.000']], ab:'Ferritina'},
  {k:'tg', l:'Triglicéridos', type:'sel', o:[[0,'<133 mg/dL'],[44,'133–354 mg/dL'],[64,'>354 mg/dL']], ab:'TG'},
  {k:'fib', l:'Fibrinógeno', type:'sel', o:[[0,'>250 mg/dL'],[30,'≤250 mg/dL']], ab:'Fibrinógeno'},
  {k:'ast', l:'AST (GOT)', type:'sel', o:[[0,'<30 U/L'],[19,'≥30 U/L']], ab:'AST'},
  {k:'hf', l:'Hemofagocitosis en médula ósea', type:'sel', o:[[0,'No'],[35,'Sí']], ab:'Hemofagocitosis'}],
  fn:v=>{ const s = v.is+v.t+v.om+v.cit+v.fer+v.tg+v.fib+v.ast+v.hf; return {v:s, d: s<=90?'Probabilidad de síndrome hemofagocítico <1 %.':(s>=250?'Probabilidad de síndrome hemofagocítico >99 %.':'Probabilidad intermedia: interpretar con la clínica y repetir si cambia.')}; }, dec:0,
  interp:x=>x>=169?{l:'high',t:'≥169: síndrome hemofagocítico probable'}:(x>90?{l:'mod',t:'Probabilidad intermedia'}:{l:'rem',t:'Poco probable (≤90)'}),
  note:'Triglicéridos en mmol/L originales: <1,5 · 1,5–4 · >4. Fibrinógeno ≤2,5 g/L. En la AIJ sistémica y el Still usar también los criterios de SAM 2016.',
  src:'Fardet L, Arthritis Rheumatol 2014;66:2613-20 (punto de corte 169: sensibilidad 93 %, especificidad 86 %)'};

const ess = (k, l, w, lv) => ({k, l:`${l} (peso ${w})`, type:'sel', o:lv.map(n=>[n*w, ['Sin actividad','Baja','Moderada','Alta'][n]]), ab:l});
C.essdai = {t:'ESSDAI (actividad sistémica del Sjögren)', alias:'essdai sjogren actividad', intro:'Elige el nivel de actividad de cada dominio (manifestaciones actuales y atribuibles a la enfermedad). La puntuación de cada dominio es peso × nivel.', f:[
  ess('con','Constitucional',3,[0,1,2]), ess('ade','Adenopatías y linfoma',4,[0,1,2,3]), ess('gla','Glandular',2,[0,1,2]),
  ess('art','Articular',2,[0,1,2,3]), ess('cut','Cutáneo',3,[0,1,2,3]), ess('pul','Pulmonar',5,[0,1,2,3]),
  ess('ren','Renal',5,[0,1,2,3]), ess('mus','Muscular',6,[0,1,2,3]), ess('snp','Sistema nervioso periférico',5,[0,1,2,3]),
  ess('snc','Sistema nervioso central',5,[0,2,3]), ess('hem','Hematológico',2,[0,1,2,3]), ess('bio','Biológico',1,[0,1,2])],
  fn:v=>Object.values(v).reduce((a,b)=>a+b,0), dec:0,
  interp:x=>x<5?{l:'low',t:'Actividad baja (<5)'}:(x<14?{l:'mod',t:'Actividad moderada (5–13)'}:{l:'high',t:'Actividad alta (≥14)'}),
  scale:{min:0,max:40,b:[[5,'low'],[14,'mod'],[40,'high']]},
  note:'Máximo 123. Mejoría mínima clínicamente importante: descenso ≥3 puntos. Las definiciones de cada nivel están en la guía de uso del ESSDAI (Seror R, RMD Open 2015).',
  src:'Seror R, Ann Rheum Dis 2010;69:1103-9 · puntos de corte: Seror R, Ann Rheum Dis 2016;75:382-9'};

C.esspri = {t:'ESSPRI (síntomas del Sjögren)', alias:'esspri sequedad fatiga dolor', f:[vas('seq','Sequedad','Sequedad'), vas('fat','Fatiga','Fatiga'), vas('dol','Dolor','Dolor')],
  fn:v=>(v.seq+v.fat+v.dol)/3, dec:1,
  interp:x=>x>=5?{l:'high',t:'≥5: estado de síntomas insatisfactorio'}:{l:'rem',t:'<5: estado de síntomas aceptable'},
  note:'Mejoría mínima clínicamente importante: descenso ≥1 punto o ≥15 %.', src:'Seror R, Ann Rheum Dis 2011;70:968-72'};

C.ffs2009 = {t:'Five-Factor Score revisado (FFS 2009)', alias:'ffs pronostico vasculitis', f:[
  {k:'e', l:'Edad >65 años', type:'chk', w:1, ab:'>65 años'}, {k:'ic', l:'Afectación cardíaca (insuficiencia cardíaca, miocardiopatía)', type:'chk', w:1, ab:'Cardíaca'},
  {k:'gi', l:'Afectación digestiva grave (hemorragia, perforación, infarto, pancreatitis)', type:'chk', w:1, ab:'Digestiva'}, {k:'cr', l:'Creatinina máxima ≥150 µmol/L (≥1,7 mg/dL)', type:'chk', w:1, ab:'Creatinina ≥150'},
  {k:'orl', l:'**Ausencia** de afectación ORL (solo en GPA y GEPA)', type:'chk', w:1, ab:'Sin ORL'}],
  fn:v=>['e','ic','gi','cr','orl'].reduce((s,k)=>s+(v[k]?1:0),0), dec:0,
  interp:x=>x===0?{l:'rem',t:'FFS 0: mortalidad a 5 años ≈9 %'}:(x===1?{l:'mod',t:'FFS 1: mortalidad a 5 años ≈21 %'}:{l:'high',t:'FFS ≥2: mortalidad a 5 años ≈40 %'}),
  note:'Validado en PAN, PAM, GPA y GEPA. Pronóstico, no actividad. La ACR 2021 desaconseja decidir el tratamiento de la PAN solo por el FFS.',
  src:'Guillevin L, Medicine (Baltimore) 2011;90:19-27'};

C.fm2016 = {t:'Criterios ACR 2016 de fibromialgia', alias:'wpi sss fibromialgia', f:[
  {k:'wpi', l:'Índice de dolor generalizado (WPI)', h:'0–19 áreas dolorosas en la última semana', min:0, max:19, int:true, ab:'WPI'},
  {k:'sss', l:'Escala de gravedad de síntomas (SSS)', h:'0–12', min:0, max:12, int:true, ab:'SSS'},
  yn('gen','Dolor en ≥4 de las 5 regiones (mandíbula, tórax y abdomen no cuentan)','Dolor generalizado'),
  yn('dur','Síntomas de intensidad similar durante ≥3 meses','≥3 meses')],
  fn:v=>{ const a = (v.wpi>=7 && v.sss>=5) || (v.wpi>=4 && v.wpi<=6 && v.sss>=9); const ok = a && v.gen && v.dur; return {v: ok?1:0, d:`WPI ${v.wpi} · SSS ${v.sss} · Índice de gravedad (WPI + SSS) ${v.wpi+v.sss}/31.`}; },
  fmtv:x=>x?'Cumple':'No cumple', interp:x=>x?{l:'high',t:'Cumple criterios de fibromialgia'}:{l:'rem',t:'No cumple criterios'},
  note:'WPI ≥7 y SSS ≥5, o WPI 4–6 y SSS ≥9. SSS = fatiga + sueño no reparador + síntomas cognitivos (0–3 cada uno) + cefalea, dolor abdominal bajo y depresión en los últimos 6 meses (0–1 cada uno). El diagnóstico es válido aunque haya otras enfermedades.',
  src:'Wolfe F, Semin Arthritis Rheum 2016;46:319-29'};

/* =================== CRITERIOS =================== */
K.yamaguchi = {t:'Criterios de Yamaguchi (1992) de enfermedad de Still del adulto', alias:'still adulto',
  gates:[{k:'x', l:'Exclusiones descartadas: infección, neoplasia (sobre todo linfoma) y otras enfermedades reumáticas'}],
  g:[{t:'Mayores', m:'sum', o:[['Fiebre ≥39 °C durante ≥1 semana',1],['Artralgias o artritis ≥2 semanas',1],['Exantema típico (asalmonado, evanescente, con la fiebre)',1],['Leucocitosis ≥10.000/mm³ con ≥80 % de neutrófilos',1]]},
     {t:'Menores', m:'sum', o:[['Odinofagia',1],['Adenopatías y/o esplenomegalia',1],['Alteración del perfil hepático',1],['FR y ANA negativos',1]]}],
  custom:({groupScores, gatesOk})=>{ const M = groupScores[0].s, m = groupScores[1].s; const met = gatesOk && M>=2 && M+m>=5;
    return {l:met?'rem':(gatesOk?'mod':'na'), v:`${M+m} / 8`, t:!gatesOk?'Antes, descartar las exclusiones':(met?'Cumple criterios de Still del adulto':'No cumple criterios'), d:`Mayores: ${M} (hacen falta ≥2) · total ≥5.`}; },
  note:'Umbrales de cada criterio según el artículo original. La ferritina no forma parte de estos criterios (sí de los de Fautrel 2002, con ferritina glucosilada ≤20 %).',
  src:'Yamaguchi M, J Rheumatol 1992;19:424-30 (sensibilidad 96,2 %, especificidad 92,1 %)'};

K.sam2016 = {t:'Criterios EULAR/ACR/PRINTO 2016 de síndrome de activación macrofágica (AIJ sistémica)', alias:'sam macrofagica',
  gates:[{k:'g', l:'Paciente febril con AIJ sistémica (o sospecha) y ferritina >684 ng/mL'}],
  g:[{t:'Al menos 2 de', m:'sum', o:[['Plaquetas ≤181.000/mm³',1],['AST >48 U/L',1],['Triglicéridos >156 mg/dL',1],['Fibrinógeno ≤360 mg/dL',1]]}],
  th:2, max:4, thTxt:'≥2 de 4', yes:'Clasifica como SAM', no:'No cumple criterios de SAM',
  note:'Validados en niños; en el Still del adulto se usan por extensión {pc}. Los biológicos pueden atenuar la fiebre y la ferritina.',
  src:'Ravelli A, Ann Rheum Dis 2016;75:481-9 (sensibilidad 0,73, especificidad 0,99)'};

K.asaspe = {t:'Criterios ASAS 2011 de espondiloartritis periférica', alias:'espondiloartritis periferica artritis reactiva',
  gates:[{k:'g', l:'Artritis, entesitis y/o dactilitis'}],
  g:[{t:'Grupo A (basta 1)', m:'sum', o:[['Uveítis',1],['Psoriasis',1],['Enfermedad de Crohn o colitis ulcerosa',1],['Infección previa (urogenital o intestinal)',1],['HLA-B27',1],['Sacroilitis en imagen (Rx o RM)',1]]},
     {t:'Grupo B (hacen falta 2)', m:'sum', o:[['Artritis',1],['Entesitis',1],['Dactilitis',1],['Dolor lumbar inflamatorio alguna vez',1],['Antecedentes familiares de EspA',1]]}],
  custom:({groupScores, gatesOk})=>{ const a = groupScores[0].s, b = groupScores[1].s; const met = gatesOk && (a>=1 || b>=2);
    return {l:met?'rem':(gatesOk?'mod':'na'), v:met?'Sí':'No', t:!gatesOk?'No cumple el requisito de entrada':(met?'Clasifica como EspA periférica':'No cumple criterios'), d:`Grupo A: ${a} (≥1) · Grupo B: ${b} (≥2). En el grupo B, la manifestación de entrada puede contarse.`}; },
  src:'Rudwaleit M, Ann Rheum Dis 2011;70:25-31 (sensibilidad 77,8 %, especificidad 82,9 %)'};

K.saf2023 = {t:'Criterios ACR/EULAR 2023 de síndrome antifosfolípido', alias:'clasificacion saf antifosfolipido',
  gates:[{k:'g', l:'≥1 criterio clínico y aPL positivo (AL, aCL o anti-β2GPI) en los 3 años siguientes'}],
  g:[
   {t:'D1. Tromboembolismo venoso', m:'max', clin:true, o:[['Con perfil de alto riesgo de TEV (factor mayor o varios menores)',1],['Sin perfil de alto riesgo',3]]},
   {t:'D2. Trombosis arterial', m:'max', clin:true, o:[['Con alto riesgo cardiovascular',2],['Sin alto riesgo cardiovascular',4]]},
   {t:'D3. Microvascular', m:'max', clin:true, o:[['Sospechada: livedo racemosa, vasculopatía livedoide, nefropatía por aPL o hemorragia pulmonar',2],['Establecida (biopsia o imagen), miocardiopatía o hemorragia suprarrenal',5]]},
   {t:'D4. Obstétrico', m:'max', clin:true, o:[['≥3 pérdidas consecutivas <10 sem o muerte fetal 16–33+6 sem sin preeclampsia ni insuficiencia placentaria grave',1],['Preeclampsia grave o insuficiencia placentaria grave <34 sem',3],['Preeclampsia grave **e** insuficiencia placentaria grave <34 sem',4]]},
   {t:'D5. Válvula cardíaca', m:'max', clin:true, o:[['Engrosamiento',2],['Vegetación',4]]},
   {t:'D6. Hematológico', m:'max', clin:true, o:[['Trombocitopenia 20–130 × 10⁹/L',2]]},
   {t:'D7. Anticoagulante lúpico', m:'max', o:[['Positivo una vez',1],['Persistente (≥12 semanas)',5]]},
   {t:'D8. aCL o anti-β2GPI por ELISA, persistentes', m:'max', o:[['IgM moderado o alto (aCL y/o anti-β2GPI)',1],['IgG moderado (40–79 U)',4],['IgG alto (≥80 U) de aCL **o** de anti-β2GPI',5],['IgG alto de aCL **y** de anti-β2GPI',7]]}],
  custom:({groupScores, gatesOk})=>{ const cl = groupScores.filter(x=>x.g.clin).reduce((a,x)=>a+x.s,0), lab = groupScores.filter(x=>!x.g.clin).reduce((a,x)=>a+x.s,0); const met = gatesOk && cl>=3 && lab>=3;
    return {l:met?'rem':(gatesOk?'mod':'na'), v:`Clínica ${cl} · Lab ${lab}`, t:!gatesOk?'No cumple el requisito de entrada':(met?'Clasifica como SAF':'No cumple criterios'), d:'Hacen falta ≥3 puntos clínicos **y** ≥3 de laboratorio. Solo cuenta el ítem de mayor peso de cada dominio, y solo si no hay otra explicación más probable.'}; },
  src:'Barbhaiya M, Ann Rheum Dis 2023;82:1258-70'};

K.sjogren2016 = {t:'Criterios ACR/EULAR 2016 de enfermedad de Sjögren', alias:'clasificacion sjogren',
  gates:[{k:'g1', l:'Sequedad ocular u oral >3 meses, o sospecha por algún dominio del ESSDAI'},{k:'g2', l:'Sin exclusiones: radioterapia de cabeza y cuello, VHC activo, sida, sarcoidosis, amiloidosis, EICH, ER-IgG4'}],
  g:[{t:'Ítems', m:'sum', o:[['Biopsia de glándula salival menor con sialoadenitis linfocítica focal y focus score ≥1',3],['Anti-SSA/Ro positivo',3],['Ocular Staining Score ≥5 (o van Bijsterveld ≥4) en ≥1 ojo',1],['Schirmer ≤5 mm/5 min en ≥1 ojo',1],['Flujo salival no estimulado ≤0,1 mL/min',1]]}],
  th:4, max:9, yes:'Clasifica como enfermedad de Sjögren (≥4)',
  note:'Suspender los anticolinérgicos el tiempo suficiente antes de medir sequedad.',
  src:'Shiboski CH, Ann Rheum Dis 2017;76:9-16'};

K.alarcon = {t:'Criterios de Alarcón-Segovia de EMTC', alias:'emtc sharp',
  gates:[{k:'g', l:'Anti-RNP por hemaglutinación ≥1:1600 (en la práctica, anti-U1-RNP a título alto)'}],
  g:[{t:'Criterios clínicos', m:'sum', o:[['Edema de manos',1],['Sinovitis',1],['Miositis (biopsia o analítica)',1],['Fenómeno de Raynaud',1],['Acroesclerosis',1]]}],
  custom:({chk, groupScores, gatesOk})=>{ const n = groupScores[0].s; const onlyThree = chk('0.0') && chk('0.3') && chk('0.4') && !chk('0.1') && !chk('0.2') && n===3; const met = gatesOk && n>=3 && !onlyThree;
    return {l:met?'rem':(gatesOk?'mod':'na'), v:`${n} / 5`, t:!gatesOk?'Falta el criterio serológico':(met?'Cumple criterios de EMTC':'No cumple criterios'), d: onlyThree?'Si los 3 son edema, Raynaud y acroesclerosis, hace falta además sinovitis o miositis.':'Serológico + ≥3 clínicos.'}; },
  src:'Alarcón-Segovia D, Villarreal M. En: Kasukawa R, Sharp GC (eds). Mixed connective tissue disease. Elsevier 1987:33-40'};

const IIM = [
 ['Edad del primer síntoma 18 a <40 años',1.3,1.5,'age'],['Edad del primer síntoma ≥40 años',2.1,2.2,'age'],
 ['Debilidad proximal simétrica de miembros superiores, habitualmente progresiva',0.7,0.7],['Debilidad proximal simétrica de miembros inferiores, habitualmente progresiva',0.8,0.5],
 ['Flexores del cuello más débiles que los extensores',1.9,1.6],['En las piernas, musculatura proximal más débil que la distal',0.9,1.2],
 ['Eritema en heliotropo',3.1,3.2],['Pápulas de Gottron',2.1,2.7],['Signo de Gottron',3.3,3.7],
 ['Disfagia o dismotilidad esofágica',0.7,0.6],['Anti-Jo-1 positivo',3.9,3.8],['CK, LDH, AST o ALT elevadas (valor máximo en la evolución)',1.3,1.4],
 ['Biopsia: infiltrado endomisial alrededor (sin invadir) de las fibras',null,1.7],['Biopsia: infiltrado perimisial y/o perivascular',null,1.2],['Biopsia: atrofia perifascicular',null,1.9],['Biopsia: vacuolas ribeteadas',null,3.1]];
K.iim2017 = {t:'Criterios EULAR/ACR 2017 de miopatía inflamatoria idiopática', alias:'clasificacion miositis dermatomiositis polimiositis',
  intro:'Puntos: **sin biopsia / con biopsia**. Aplicar solo si no hay otra explicación mejor.',
  g:[{t:'Biopsia muscular', m:'one', o:[['No realizada',null],['Realizada',null]]},
     {t:'Edad', m:'one', o:[['<18 años',null],['18 a <40 años (1,3 / 1,5)',null],['≥40 años (2,1 / 2,2)',null]]},
     {t:'Ítems', m:'sum', o:IIM.filter(x=>x[3]!=='age').map(x=>[`${x[0]} (${x[1]==null?'—':String(x[1]).replace('.',',')} / ${String(x[2]).replace('.',',')})`, null])}],
  custom:({chk})=>{ const bx = chk('0.1'); const it = IIM.filter(x=>x[3]!=='age'); let s = chk('1.1') ? (bx?1.5:1.3) : (chk('1.2') ? (bx?2.2:2.1) : 0);
    it.forEach((x,i)=>{ if(chk('2.'+i)){ const w = bx ? x[2] : x[1]; if(w!=null) s += w; } });
    s = Math.round(s*10)/10; const t = bx ? [6.5,6.7,8.7] : [5.3,5.5,7.5];
    const lvl = s>=t[2]?'Definida (≥90 %)':(s>=t[1]?'Probable (≥55 %)':(s>=t[0]?'Posible (≥50 %)':'No clasifica'));
    return {l: s>=t[1]?'rem':(s>=t[0]?'mod':'na'), v:`${String(s).replace('.',',')}`, t:`MII ${lvl.toLowerCase()}`, d:`Umbrales ${bx?'con':'sin'} biopsia: posible ≥${nf1(t[0])} · probable ≥${nf1(t[1])} (mínimo para clasificar) · definida ≥${nf1(t[2])}. ${bx?'':'Los ítems de biopsia solo cuentan si se marca «Realizada».'}`}; },
  note:'Subgrupos: <18 años con lesiones cutáneas → DM juvenil; heliotropo o Gottron → DM (sin debilidad: DM amiopática); vacuolas ribeteadas o debilidad de flexores de los dedos sin respuesta al tratamiento → miositis por cuerpos de inclusión; el resto → polimiositis (incluye la necrotizante).',
  src:'Lundberg IE, Ann Rheum Dis 2017;76:1955-64 (probable: sensibilidad 87 %/93 %, especificidad 82 %/88 % sin/con biopsia)'};

K.imacs = {t:'Riesgo de cáncer en miositis (IMACS 2023)', alias:'cribado cancer miositis',
  g:[{t:'Factores de alto riesgo', m:'sum', o:[['Dermatomiositis',1],['Anti-TIF1γ o anti-NXP2',1],['Inicio >40 años',1],['Actividad alta persistente pese al tratamiento',1],['Disfagia moderada-grave',1],['Necrosis o úlceras cutáneas',1]]},
     {t:'Factores de riesgo intermedio', m:'sum', o:[['DM amiopática, polimiositis o miopatía necrotizante',1],['Anti-SAE1, anti-HMGCR, anti-Mi-2 o anti-MDA5',1],['Varón',1]]}],
  custom:({groupScores})=>{ const h = groupScores[0].s, m = groupScores[1].s;
    const r = h>=2 ? 'high' : ((h===1 || m>=2) ? 'mod' : 'rem');
    const txt = {high:'Riesgo alto', mod:'Riesgo moderado', rem:'Riesgo estándar'}[r];
    const plan = {high:'Panel básico + ampliado al diagnóstico y panel básico anual 3 años. Si es negativo, valorar PET-TC y endoscopia alta y baja.', mod:'Panel básico + ampliado al diagnóstico.', rem:'Panel básico al diagnóstico y programas poblacionales.'}[r];
    return {l:r, v:txt, t:`Alto ${h} · intermedio ${m}`, d:plan+' Cribar a cualquiera con signos de alarma (pérdida de peso, fiebre, sudoración, tabaco, antecedentes familiares).'}; },
  note:'Riesgo alto: ≥2 factores altos. Moderado: 1 factor alto o ≥2 intermedios. No hace falta cribado específico en la miositis juvenil ni en la miositis por cuerpos de inclusión. Panel básico: historia y exploración, hemograma, perfil hepático, VSG, PCR, proteinograma con cadenas ligeras, orina y Rx de tórax. Ampliado: TC de cuello-tórax-abdomen-pelvis, citología, mamografía, PSA, CA-125 y ecografía transvaginal, sangre oculta en heces.',
  src:'Oldroyd AGS, Nat Rev Rheumatol 2023;19:805-17'};

K.connors = {t:'Criterios de Connors (2010) de síndrome antisintetasa', alias:'antisintetasa',
  gates:[{k:'g', l:'Anticuerpo antiaminoacil-ARNt sintetasa (Jo-1, PL-7, PL-12, EJ, OJ, KS, Zo, Ha)'}],
  g:[{t:'Al menos 1 de', m:'sum', o:[['Miositis',1],['Enfermedad pulmonar intersticial',1],['Artritis',1],['Fiebre sin otra causa',1],['Fenómeno de Raynaud',1],['Manos de mecánico',1]]}],
  th:1, max:6, thTxt:'anticuerpo + ≥1', yes:'Compatible con síndrome antisintetasa',
  note:'Hay criterios ACR/EULAR 2025 (proyecto CLASS) con niveles definido, probable y posible; sus pesos no están disponibles en abierto.',
  src:'Connors GR, Chest 2010;138:1464-74'};

K.mcadam = {t:'Criterios de McAdam (1976) de policondritis recidivante', alias:'policondritis',
  g:[{t:'Criterios', m:'sum', o:[['Condritis auricular bilateral',1],['Poliartritis inflamatoria seronegativa no erosiva',1],['Condritis nasal',1],['Inflamación ocular (conjuntivitis, escleritis, uveítis…)',1],['Condritis laringotraqueal',1],['Disfunción coclear o vestibular',1]]}],
  th:3, max:6, thTxt:'≥3 de 6', yes:'Cumple criterios de McAdam',
  note:'Damiani (1979) amplía el diagnóstico a: ≥1 criterio de McAdam + histología compatible, o condritis en ≥2 localizaciones que responde a GC o dapsona. Pensar en VEXAS en varón >50 años con macrocitosis.',
  src:'McAdam LP, Medicine 1976;55:193-215 · Damiani JM, Laryngoscope 1979;89:929-46'};

K.igg4_2019 = {t:'Criterios ACR/EULAR 2019 de enfermedad relacionada con IgG4', alias:'clasificacion igg4',
  gates:[{k:'g1', l:'Afectación clínica o radiológica típica (páncreas, salivales, vía biliar, órbita, riñón, pulmón, aorta, retroperitoneo, paquimeninge, tiroides) o histología compatible inexplicada'},{k:'g2', l:'Ningún criterio de exclusión (fiebre, falta de respuesta a GC, citopenias, eosinofilia, ANCA, anti-Ro/La, anti-dsDNA, RNP, Sm, crioglobulinas, sospecha de tumor o infección, necrosis, granulomas, vasculitis necrosante, Castleman multicéntrico…)'}],

/* ---------------- formato en línea ---------------- */
function fmt(s){
  if(s==null) return '';
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/==(.+?)==/g,'<span class="hi">$1</span>');
  h = h.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<i>$2</i>');
  h = h.replace(/\{f:(.+?)\}/g,'<span class="freq">$1</span>');
  h = h.replace(/\{pc\}/g,'<span class="pc" title="Práctica clínica habitual; no recogido en guía">Práctica clínica</span>');
  h = h.replace(/\{off\}/g,'<span class="off" title="Uso fuera de las indicaciones de la ficha técnica en España (RD 1015/2009)">Fuera de ficha técnica</span>');
  h = h.replace(/\{nf\}/g,'<span class="nf" title="Indicación sin financiación del SNS (BIFIMED)">No financiado SNS</span>');
  h = h.replace(/\{fr\}/g,'<span class="off" title="Financiación SNS con condiciones restringidas (BIFIMED)">Financiación restringida</span>');
  h = h.replace(/\[\[([a-z0-9_:#.\-]+)(?:\|(.+?))?\]\]/g,(m,id,lab)=>{
    if(id.startsWith('e:')){ const d=DMAP[id.slice(2)]; return `<a class="dl" href="#e.${id.slice(2)}">${lab||(d?d.name:id)}</a>`; }
    if(id.startsWith('p:')){ const t=TESTS[id.slice(2)]; return `<a class="dl" href="#p.${id.slice(2)}">${lab||(t?t.n:id)}</a>`; }
    if(id.startsWith('#')) return `<a class="dl" href="${id}">${lab||id}</a>`;
    const d = DRUGS[id];
    if(!d) return lab||id;
    return `<a class="dl" href="#f.${id}">${lab||d.n}</a>`;
  });
  return h;
}
function plain(s){
  return String(s==null?'':s).replace(/\*\*|==/g,'').replace(/\*([^*\s][^*]*?)\*/g,'$1').replace(/\{f:(.+?)\}/g,'$1').replace(/\{(pc|off|nf|fr)\}/g,'')
    .replace(/\[\[([a-z0-9_:#.\-]+)(?:\|(.+?))?\]\]/g,(m,id,lab)=>{
      if(lab) return lab;
      if(id.startsWith('e:')) return (DMAP[id.slice(2)]||{}).name||'';
      if(id.startsWith('p:')) return (TESTS[id.slice(2)]||{}).n||'';
      return (DRUGS[id]||{}).n||'';
    });
}

function renderListSafe(items){

/* ---------------- números ---------------- */
const nf = (x, d=2) => (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace('.',',');
const parseNum = s => { if(s==null) return null; s=String(s).trim().replace(',','.'); if(s==='') return null; if(!/^-?\d*\.?\d+$/.test(s) && !/^-?\d+\.$/.test(s)) return NaN; return parseFloat(s); };
const today = () => { const d=new Date(); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };

/* ---------------- calculadoras ---------------- */
const CALC_STATE = {};
function crpUnit(){ return store.get('crpUnit','mgdL'); }
function fieldRange(f, unit){
  if(f.type==='crp'){ return unit==='mgL' ? {min:0,max:500,step:1} : {min:0,max:50,step:0.1}; }
  return {min:f.min, max:f.max, step:f.step||1};
}
function renderCalc(id, ctx){
  const c = CALCS[id]; if(!c) return '';
  const uid = `c${++CALC_SEQ}`;
  CALC_STATE[uid] = {id, v:{}, unit:crpUnit()};
  const fields = c.f.map(f=>{
    const fid = `${uid}-${f.k}`;
    if(f.type==='chk'){
      return `<label class="opt"><input type="checkbox" id="${fid}" data-c="${uid}" data-k="${f.k}"><span class="tx">${fmt(f.l)}</span>${f.w!=null?`<span class="pts">+${nf(f.w, f.w%1?2:0)}</span>`:''}</label>`;
    }
    if(f.type==='sel'){
      if(c.layout==='grid17') return `<div class="lab">${fmt(f.l)}</div><div class="segfull" role="group" aria-label="${esc(plain(f.l))}">${f.o.map(([v,l])=>`<button type="button" data-c="${uid}" data-k="${f.k}" data-v="${v}" aria-pressed="false">${esc(l)}</button>`).join('')}</div>`;
      return `<div class="field" data-f="${f.k}"><span class="lab">${fmt(f.l)}${f.h?` <span class="hint">${esc(f.h)}</span>`:''}</span><div class="segfull" role="group" aria-label="${esc(plain(f.l))}">${f.o.map(([v,l])=>`<button type="button" data-c="${uid}" data-k="${f.k}" data-v="${v}" aria-pressed="false">${esc(l)}</button>`).join('')}</div></div>`;
    }
    const unit = CALC_STATE[uid].unit;
    const rg = fieldRange(f, unit);
    const unitCtl = f.type==='crp' ? `<div class="seg" role="group" aria-label="Unidad de PCR"><button type="button" data-unit="mgL" data-c="${uid}" aria-pressed="${unit==='mgL'}">mg/L</button><button type="button" data-unit="mgdL" data-c="${uid}" aria-pressed="${unit==='mgdL'}">mg/dL</button></div>` : '';
    const steppers = f.type!=='crp' && !f.nostep;
    return `<div class="field" data-f="${f.k}"><label for="${fid}">${fmt(f.l)}${f.h?` <span class="hint">${esc(f.h)}</span>`:''}</label>
      <div class="ctrl">${steppers?`<button type="button" class="st" data-c="${uid}" data-k="${f.k}" data-d="-1" aria-label="Restar">−</button>`:''}<input id="${fid}" data-c="${uid}" data-k="${f.k}" inputmode="decimal" autocomplete="off" placeholder="${f.type==='crp'?(unit==='mgL'?'mg/L':'mg/dL'):`${rg.min}–${rg.max}`}" aria-describedby="${fid}-m">${steppers?`<button type="button" class="st" data-c="${uid}" data-k="${f.k}" data-d="1" aria-label="Sumar">+</button>`:''}${unitCtl}</div>
      <div class="msg" id="${fid}-m" aria-live="polite"></div></div>`;
  }).join('');
  const isChk = c.f.every(f=>f.type==='chk');
  return `<div class="calc" id="${uid}" data-calc="${id}">
    <div class="calc-h">${ic('gauge')}<h3>${fmt(c.t)}</h3><button type="button" class="btn sm ghost noprint" data-reset="${uid}">Borrar</button></div>
    <div class="calc-b">${c.intro?`<div class="small muted">${fmt(c.intro)}</div>`:''}
      <div class="${c.layout==='grid17'?'grid17':(isChk?'opts':'fields')}">${fields}</div>
      <div class="res" id="${uid}-r" data-l="na" aria-live="polite"></div>
      ${c.note?`<div class="small muted">${fmt(c.note)}</div>`:''}
    </div>
    ${c.src?`<div class="src"><b>Fuente:</b> ${fmt(c.src)}</div>`:''}
  </div>`;
}
function calcValues(uid){
  const st = CALC_STATE[uid]; const c = CALCS[st.id];
  const vals = {}; let ok = true; const errs = {};
  c.f.forEach(f=>{
    if(f.type==='chk'){ vals[f.k] = !!st.v[f.k]; return; }
    if(f.type==='sel'){ if(st.v[f.k]==null){ ok=false; } else vals[f.k]=Number(st.v[f.k]); return; }
    const raw = st.v[f.k];
    const x = parseNum(raw);
    if(x==null){ ok=false; return; }
    const rg = fieldRange(f, st.unit);
    if(isNaN(x)){ ok=false; errs[f.k]='Introduce un número'; return; }
    if(x<rg.min || x>rg.max){ ok=false; errs[f.k]=`Valor fuera de rango (${String(rg.min).replace('.',',')}–${String(rg.max).replace('.',',')})`; return; }
    if((f.int) && Math.round(x)!==x){ ok=false; errs[f.k]='Debe ser un número entero'; return; }
    if(f.type==='crp'){ vals[f.k] = x; vals[f.k+'_mgL'] = st.unit==='mgL'? x : x*10; vals[f.k+'_mgdL'] = st.unit==='mgL'? x/10 : x; }
    else vals[f.k]=x;
  });
  return {ok, vals, errs};
}
function updateCalc(uid){
  const st = CALC_STATE[uid]; if(!st) return; const c = CALCS[st.id];
  const box = document.getElementById(uid); if(!box) return;
  const {ok, vals, errs} = calcValues(uid);
  c.f.forEach(f=>{
    const fe = box.querySelector(`.field[data-f="${f.k}"]`); if(!fe) return;
    fe.classList.toggle('err', !!errs[f.k]);
    const m = fe.querySelector('.msg'); if(m) m.textContent = errs[f.k]||'';
  });
  const r = document.getElementById(uid+'-r');
  if(!ok){
    const missing = c.f.filter(f=>f.type!=='chk' && (st.v[f.k]==null || st.v[f.k]==='')).length;
    r.dataset.l='na';
    r.innerHTML = `<div class="top"><span class="val">${Object.keys(errs).length?'Revisa los valores marcados':(missing?`Faltan ${missing} dato${missing>1?'s':''}`:'—')}</span></div>`;
    st.last=null; return;
  }
  const out = c.fn(vals);
  const val = typeof out==='object' ? out.v : out;
  const interp = c.interp ? c.interp(val, vals) : {l:'na', t:''};
  const dec = c.dec==null?2:c.dec;
  const valStr = (c.fmtv ? c.fmtv(val, vals) : nf(val, dec));
  let scale='';
  if(c.scale){
    const {min,max,b} = c.scale; const span=max-min; let prev=min;
    const segs = b.map(([to,l])=>{ const t=Math.min(to,max); const w=(t-prev)/span*100; prev=t; return `<i class="${l}" style="width:${w}%"></i>`; }).join('');
    const pos = Math.max(0,Math.min(100,(val-min)/span*100));
    scale = `<div class="scalewrap"><div class="scale">${segs}</div><span class="mk" style="left:${pos}%"></span><div class="ticks"><span>${nf(min,c.scale.td||0)}</span>${b.slice(0,-1).map(([to])=>`<span>${String(to).replace('.',',')}</span>`).join('')}<span>${nf(max,c.scale.td||0)}</span></div></div>`;
  }
  const detail = out && out.d ? `<div class="det">${fmt(out.d)}</div>` : (interp.d?`<div class="det">${fmt(interp.d)}</div>`:'');
  r.dataset.l = interp.l;
  r.innerHTML = `<div class="top"><span class="val">${valStr}</span><span class="lbl">${esc(interp.t)}</span><span class="acts"><button type="button" class="btn sm" data-copy="${uid}">${ic('copy')}Copiar</button></span></div>${detail}${scale}`;
  // texto para la historia clínica
  const parts = c.f.map(f=>{
    if(f.type==='chk') return vals[f.k] ? (f.ab||plain(f.l)) : null;
    if(f.type==='sel'){ const o=f.o.find(o=>String(o[0])===String(vals[f.k])); return `${f.ab||plain(f.l)} ${o?o[1]:vals[f.k]}`; }
    if(f.type==='crp') return `PCR ${String(vals[f.k]).replace('.',',')} ${st.unit==='mgL'?'mg/L':'mg/dL'}`;
    return `${f.ab||plain(f.l)} ${String(vals[f.k]).replace('.',',')}${f.u?' '+f.u:''}`;
  }).filter(Boolean);
  st.last = `${c.copy||plain(c.t)}: ${valStr}${interp.t?` (${interp.t})`:''}. ${parts.length?parts.join('; ')+'. ':''}${out&&out.cp?out.cp+' ':''}Fecha: ${today()}.`;
}

/* ---------------- criterios interactivos ---------------- */
const CRIT_STATE = {};
function renderCrit(id, ctx){
  const c = CRITS[id]; if(!c) return '';
  const uid = `k${++CALC_SEQ}`;
  CRIT_STATE[uid] = {id, s:{}};
  const opt = (type, name, k, label, pts, extra='') => `<label class="opt"><input type="${type}" name="${name}" data-k="${k}" data-crit="${uid}" ${extra}><span class="tx">${fmt(label)}</span>${pts!=null?`<span class="pts">${pts>0?'+':''}${String(pts).replace('.',',')}</span>`:''}</label>`;
  let h = '';
  if(c.gates) h += `<div class="grp"><div class="gh">Requisito de entrada</div>${c.gates.map(g=>opt('checkbox',uid+'-g',g.k,g.l,null)).join('')}</div>`;
  if(c.suff) h += `<div class="grp"><div class="gh">Criterio suficiente <span class="gn">(si está presente, clasifica sin puntuar)</span></div>${opt('checkbox',uid+'-s',c.suff.k,c.suff.l,null)}</div>`;
  c.g.forEach((g,gi)=>{
    const name = `${uid}-${gi}`;
    const modeTxt = g.m==='one'?'elige una':(g.m==='max'?'cuenta solo el de mayor peso':(g.m==='sum'?'suma todos los presentes':''));
    h += `<div class="grp"><div class="gh">${fmt(g.t)} ${modeTxt?`<span class="gn">(${modeTxt})</span>`:''}</div>${g.o.map((o,oi)=>opt(g.m==='one'?'radio':'checkbox', name, `${gi}.${oi}`, o[0], o[1]==null?null:o[1], g.m==='one'&&oi===0&&g.def0!==false?'checked':'')).join('')}</div>`;
  });
  return `<div class="calc" id="${uid}" data-crit="${id}">
    <div class="calc-h">${ic('crit')}<h3>${fmt(c.t)}</h3><button type="button" class="btn sm ghost noprint" data-reset="${uid}">Borrar</button></div>
    <div class="calc-b">${c.intro?`<div class="small muted">${fmt(c.intro)}</div>`:''}${h}
      <div class="res" id="${uid}-r" data-l="na" aria-live="polite"></div>
      ${c.note?`<div class="small muted">${fmt(c.note)}</div>`:''}
    </div>
    ${c.src?`<div class="src"><b>Fuente:</b> ${fmt(c.src)}</div>`:''}
  </div>`;
}
function updateCrit(uid){
  const st = CRIT_STATE[uid]; if(!st) return; const c = CRITS[st.id];
  const box = document.getElementById(uid); if(!box) return;
  const chk = k => { const el = box.querySelector(`input[data-k="${k}"]`); return el && el.checked; };
  const gatesOk = !c.gates || c.gates.every(g=>chk(g.k));
  const suff = c.suff && chk(c.suff.k);
  let score = 0; const picked = [];
  const groupScores = c.g.map((g,gi)=>{
    const on = g.o.map((o,oi)=>chk(`${gi}.${oi}`) ? o : null).filter(Boolean);
    let s = 0;
    if(g.m==='sum') s = on.reduce((a,o)=>a+(o[1]||0),0);
    else if(on.length) s = Math.max(...on.map(o=>o[1]||0));
    on.forEach(o=>{ if((o[1]||0)!==0 || g.m!=='one') picked.push(plain(o[0])+(o[1]!=null?` (${o[1]>0?'+':''}${o[1]})`:'')); });
    return {s, on, g};
  });
  score = groupScores.reduce((a,x)=>a+x.s,0);
  let res;
  if(c.custom){ res = c.custom({chk, score, groupScores, gatesOk, suff}); }
  else {
    const reqMsg = c.req ? c.req({chk, groupScores}) : null;
    const met = gatesOk && (suff || (score>=c.th && !reqMsg));
    res = {
      l: met?'rem':(gatesOk?'mod':'na'),
      v: suff ? 'Suficiente' : `${String(Math.round(score*100)/100).replace('.',',')}${c.max?` / ${c.max}`:''}`,
      t: !gatesOk ? 'No cumple el requisito de entrada' : (met ? (c.yes||'Cumple criterios de clasificación') : (c.no||'No cumple criterios')),
      d: suff ? c.suff.l : (reqMsg ? reqMsg : (c.th!=null?`Umbral: ${c.thTxt||'≥ '+String(c.th).replace('.',',')}`:''))
    };
  }
  const r = document.getElementById(uid+'-r');
  r.dataset.l = res.l;
  r.innerHTML = `<div class="top"><span class="val">${esc(res.v)}</span><span class="lbl">${esc(res.t)}</span><span class="acts"><button type="button" class="btn sm" data-copy="${uid}">${ic('copy')}Copiar</button></span></div>${res.d?`<div class="det">${fmt(res.d)}</div>`:''}`;
  st.last = `${c.copy||plain(c.t)}: ${res.v} — ${res.t}.${picked.length?' Ítems: '+picked.join('; ')+'.':''} Fecha: ${today()}.`;
}

/* ---------------- eventos de calculadoras ---------------- */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.c && t.type!=='checkbox'){
    const st = CALC_STATE[t.dataset.c]; if(!st) return;
    // solo caracteres numéricos válidos
    const clean = t.value.replace(/[^\d.,]/g,'').replace(/([.,].*)[.,]/g,'$1');
    if(clean!==t.value) t.value = clean;
    st.v[t.dataset.k] = t.value; updateCalc(t.dataset.c);
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.type==='checkbox' && t.dataset.c){ const st=CALC_STATE[t.dataset.c]; if(st){ st.v[t.dataset.k]=t.checked; updateCalc(t.dataset.c);} }
  if(t.dataset && t.dataset.crit){ updateCrit(t.dataset.crit); }
});
async function copyText(txt, btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(err){
    try{ const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e2){}
  }
  if(ok) toast('Copiado. Ya puedes pegarlo en la historia clínica');
  else { toast('No se pudo copiar automáticamente: selecciona el texto'); const pre=document.createElement('div'); pre.className='note'; pre.textContent=txt; btn.closest('.res').appendChild(pre); }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.classList.contains('st')){
    const uid=b.dataset.c, k=b.dataset.k, st=CALC_STATE[uid]; const c=CALCS[st.id]; const f=c.f.find(x=>x.k===k);
    const rg=fieldRange(f, st.unit); let x=parseNum(st.v[k]); if(x==null||isNaN(x)) x = Number(b.dataset.d)>0 ? rg.min-rg.step : rg.min+rg.step;
    x = Math.round((x + Number(b.dataset.d)*rg.step)*1000)/1000; x=Math.max(rg.min,Math.min(rg.max,x));
    const inp=document.getElementById(`${uid}-${k}`); inp.value=String(x).replace('.',','); st.v[k]=inp.value; updateCalc(uid); return;
  }
  if(b.dataset.unit){
    const uid=b.dataset.c, st=CALC_STATE[uid]; if(st.unit===b.dataset.unit) return;
    const old=st.unit; st.unit=b.dataset.unit; store.set('crpUnit', st.unit);
    const c=CALCS[st.id];
    c.f.filter(f=>f.type==='crp').forEach(f=>{
      const inp=document.getElementById(`${uid}-${f.k}`); const x=parseNum(st.v[f.k]);
      if(x!=null && !isNaN(x)){ const nv = old==='mgL'? x/10 : x*10; inp.value = String(Math.round(nv*100)/100).replace('.',','); st.v[f.k]=inp.value; }
      inp.placeholder = st.unit==='mgL'?'mg/L':'mg/dL';
    });
    $$(`button[data-unit][data-c="${uid}"]`).forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.unit===st.unit)));
    updateCalc(uid); return;
  }
  if(b.dataset.v!=null && b.dataset.c){
    const uid=b.dataset.c, st=CALC_STATE[uid];
    st.v[b.dataset.k]=b.dataset.v;
    $$(`button[data-c="${uid}"][data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    updateCalc(uid); return;
  }
  if(b.dataset.copy){ const uid=b.dataset.copy; const st=CALC_STATE[uid]||CRIT_STATE[uid]; if(st&&st.last) copyText(st.last, b); return; }
  if(b.dataset.reset){
    const uid=b.dataset.reset; const box=document.getElementById(uid);
    if(CALC_STATE[uid]){ CALC_STATE[uid].v={}; $$('input',box).forEach(i=>{ if(i.type==='checkbox') i.checked=false; else i.value=''; }); $$('button[data-v]',box).forEach(x=>x.setAttribute('aria-pressed','false')); updateCalc(uid); }
    if(CRIT_STATE[uid]){ $$('input',box).forEach(i=>{ i.checked = false; }); $$('.grp',box).forEach(g=>{ const r=g.querySelector('input[type=radio]'); if(r) r.checked=true; }); updateCrit(uid); }
  }
});
function initWidgets(root){
  $$('.calc[data-calc]', root).forEach(el=>updateCalc(el.id));
  $$('.calc[data-crit]', root).forEach(el=>updateCrit(el.id));
}

/* ---------------- favoritos y recientes ---------------- */
function favs(){ return store.get('fav', []); }
function isFav(r){ return favs().some(f=>f.r===r); }
function toggleFav(r, t, fam){
  let f = favs(); if(f.some(x=>x.r===r)) f=f.filter(x=>x.r!==r); else f.unshift({r,t,fam});
  store.set('fav', f.slice(0,40)); return f.some(x=>x.r===r);
}
function pushRecent(r, t, fam){
  let a = store.get('recent', []).filter(x=>x.r!==r); a.unshift({r,t,fam}); store.set('recent', a.slice(0,10));
}

/* ---------------- búsqueda ---------------- */
function normChar(c){ const n=c.normalize('NFD').replace(/[̀-ͯ]/g,''); return (n||' ').toLowerCase().charAt(0)||' '; }
function norm(s){ let o=''; for(const c of String(s)) o+=normChar(c); return o; }
const STOP = new Set(['de','la','el','en','y','a','los','las','del','por','con','para','un','una','o','al','que','se','e','u']);
function tokens(s){
  const n = norm(s);
  const t = n.split(/[^a-z0-9]+/).filter(x=>x.length>0);
  const joined = (n.match(/[a-z0-9]+(?:[-\/][a-z0-9]+)+/g)||[]).map(x=>x.replace(/[-\/]/g,''));
  return t.concat(joined);
}
const DOCS = []; const VOCAB = new Map();
function addDoc(d){
  d.i = DOCS.length; DOCS.push(d);
  const tt = tokens(d.title + ' ' + (d.alias||''));
  d.tset = new Set(tt);
  const all = new Set(tt.concat(tokens(d.text||'')));
  all.forEach(tok=>{ if(!VOCAB.has(tok)) VOCAB.set(tok, []); VOCAB.get(tok).push(d.i); });
}
function buildIndex(){
  DIS.forEach(d=>{
    const fam = FAM[d.fam];
    addDoc({type:'d', title:d.name, alias:[d.short, ...(d.aliases||[])].join(' '), sub:fam.name+(d.status==='pend'?' · pendiente':''), text:fam.name, r:`e.${d.id}`, fam:d.fam});
    if(d.status!=='ok') return;
    TABS.forEach(tb=>{
      const secs = d.tabs[tb.k]; if(!secs) return;
      secs.forEach((s,i)=>{
        addDoc({type:'s', title:plain(s.h||tb.n), sub:`${d.short||d.name} › ${tb.n}`, text: s.b.map(blockText).join(' · ') + ' ' + d.name + ' ' + (d.short||''), r:`e.${d.id}.${tb.k}`, anchor:`${d.id}-${tb.k}-${i}`, fam:d.fam});
      });
    });
  });
  Object.entries(DRUGS).forEach(([id,d])=>{
    const txt = [d.cls, d.br, (d.dose||[]).map(x=>x.join(' ')).join(' '), d.ren, d.hep, d.preg, d.lact, (d.mon||[]).join(' '), (d.ae||[]).join(' '), (d.ci||[]).join(' '), (d.int||[]).join(' '), d.notes||'', (d.vs||[]).flat().join(' ')].map(plain).join(' · ');
    addDoc({type:'f', title:d.n, alias:(d.ab||[]).join(' ')+' '+(d.br||''), sub:d.cls, text:txt, r:`f.${id}`, fam:'gen'});
  });
  Object.entries(TESTS).forEach(([id,t])=>{
    addDoc({type:'p', title:t.n, alias:(t.ab||[]).join(' '), sub:t.what, text:t.what+' '+(t.notes||''), r:`p.${id}`, fam:'gen'});
  });
  R.pages.forEach(pg=>{
    pg.secs.forEach((s,i)=>addDoc({type:'s', title:plain(s.h), sub:pg.title, text:s.b.map(blockText).join(' · ')+' '+pg.title, r:pg.id, anchor:`${pg.id}-${i}`, fam:'gen'}));
  });
}
function osa(a,b,max){
  const la=a.length, lb=b.length; if(Math.abs(la-lb)>max) return max+1;
  let prev2=null, prev=Array.from({length:lb+1},(_,j)=>j);
  for(let i=1;i<=la;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=lb;j++){
      let v=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v, prev2[j-2]+1);
      cur[j]=v; if(v<rowMin) rowMin=v;
    }
    if(rowMin>max) return max+1;
    prev2=prev; prev=cur;
  }
  return prev[lb];
}
const MCACHE = new Map();
function matchTok(q){
  if(MCACHE.has(q)) return MCACHE.get(q);
  const out=[]; const fz = q.length>=7?2:(q.length>=4?1:0);
  for(const v of VOCAB.keys()){
    if(v===q){ out.push([v,3]); continue; }
    if(v.startsWith(q) && q.length>=2){ out.push([v, q.length>=3?2.2:1.6]); continue; }
    if(fz){
      if(Math.abs(v.length-q.length)<=fz && osa(q,v,fz)<=fz){ out.push([v,1.3]); continue; }
      if(q.length>=5 && v.length>q.length && osa(q, v.slice(0,q.length), 1)<=1){ out.push([v,1.0]); }
    }

function scoreTok(q){
  const m=new Map(), hits=new Map();
  matchTok(q).forEach(([v,w])=>{
    VOCAB.get(v).forEach(di=>{
      const s = w*(DOCS[di].tset.has(v)?2.2:1);
      if(!m.has(di)||m.get(di)<s){ m.set(di,s); }
      if(!hits.has(di)) hits.set(di,new Set()); hits.get(di).add(v);
    });
  });
  return {m,hits};
}
function search(q){
  const qn = norm(q).trim(); if(!qn) return {res:[],toks:[]};
  let qt = qn.split(/[^a-z0-9]+/).filter(t=>t && !STOP.has(t));
  if(!qt.length) qt = qn.split(/[^a-z0-9]+/).filter(Boolean);
  const SYN = R.syn;
  // frases completas con sinónimo (p. ej., "arteritis temporal")
  const groups = []; const usedPhrase = SYN[qt.join(' ')];
  if(usedPhrase && qt.length>1){ groups.push([qt, ...usedPhrase.map(p=>tokens(p))]); }
  else qt.forEach(t=>{ const alts=[[t]]; (SYN[t]||[]).forEach(p=>alts.push(tokens(p).filter(x=>!STOP.has(x)))); groups.push(alts); });
  const allHits = new Map();
  const groupMaps = groups.map(alts=>{
    const gm = new Map();
    alts.forEach(alt=>{
      const parts = alt.map(scoreTok);
      let base = parts[0].m;
      base.forEach((s,di)=>{
        let tot=0, ok=true;
        for(const p of parts){ const v=p.m.get(di); if(v==null){ok=false;break;} tot+=v; }
        if(!ok) return;
        const sc = tot/parts.length;
        if(!gm.has(di)||gm.get(di)<sc) gm.set(di,sc);
        if(!allHits.has(di)) allHits.set(di,new Set());
        parts.forEach(p=>(p.hits.get(di)||[]).forEach(h=>allHits.get(di).add(h)));
      });
    });
    return gm;
  });
  let cand = new Map(); let approx=false;
  if(groupMaps.length){
    groupMaps[0].forEach((s,di)=>{ let tot=s, ok=true; for(let i=1;i<groupMaps.length;i++){ const v=groupMaps[i].get(di); if(v==null){ok=false;break;} tot+=v; } if(ok) cand.set(di,tot); });
    if(!cand.size){ approx=true; groupMaps.forEach(gm=>gm.forEach((s,di)=>cand.set(di,(cand.get(di)||0)+s))); }
  }
  const tb = {d:4, f:3, p:2, s:0};
  const res = Array.from(cand.entries()).map(([di,s])=>{
    const d = DOCS[di]; let sc = s + tb[d.type];
    if(norm(d.title).startsWith(qn)) sc+=5; else if(norm(d.alias||'').split(/\s+/).includes(qn)) sc+=5;
    return {d, sc, hits:Array.from(allHits.get(di)||[])};
  }).sort((a,b)=>b.sc-a.sc);
  return {res, approx};
}
function snippet(text, hits){
  if(!text) return '';
  const n = norm(text);
  let pos=-1, len=0;
  for(const h of hits){ const re=new RegExp('(^|[^a-z0-9])'+h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); const m=re.exec(n); if(m){ const p=m.index+m[1].length; if(pos<0||p<pos){pos=p; len=h.length;} } }
  if(pos<0) return esc(text.slice(0,90));
  const a=Math.max(0,pos-36), b=Math.min(text.length,pos+len+60);
  return (a>0?'…':'')+esc(text.slice(a,pos))+'<mark>'+esc(text.slice(pos,pos+len))+'</mark>'+esc(text.slice(pos+len,b))+(b<text.length?'…':'');
}

function highlight(root, hits){
  if(!root||!hits||!hits.length) return null;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=> (n.parentElement.closest('script,style,button,input,mark,svg')||!n.nodeValue.trim()) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  const re = new RegExp('(^|[^a-z0-9])('+hits.map(h=>h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')','g');
  let first=null;
  nodes.forEach(node=>{
    const txt=node.nodeValue, n=norm(txt); let m, last=0; const frag=document.createDocumentFragment(); let found=false;
    re.lastIndex=0;
    while((m=re.exec(n))){
      const s=m.index+m[1].length; let e=s+m[2].length;
      while(e<n.length && /[a-z0-9]/.test(n[e])) e++;
      frag.appendChild(document.createTextNode(txt.slice(last,s)));
      const mk=document.createElement('mark'); mk.textContent=txt.slice(s,e); frag.appendChild(mk); if(!first) first=mk;
      last=e; found=true; re.lastIndex=e;
    }
    if(found){ frag.appendChild(document.createTextNode(txt.slice(last))); node.parentNode.replaceChild(frag,node); }
  });
  return first;
}
